# Perfil "test": H2 em memória, sem RabbitMQ e sem chamada real à IA.
spring:
  datasource:
    url: jdbc:h2:mem:valky_test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  ai:
    openai:
      api-key: chave-de-teste

valky:
  jwt:
    secret: segredo-de-teste-com-mais-de-32-caracteres-123456
    expiracao-segundos: 600
  seed:
    enabled: false
